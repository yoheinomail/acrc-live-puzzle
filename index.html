
<!DOCTYPE html>
<html>
<head>
  <title>🎏 ACRC ナレ４_Liveパズル！</title>
  <style>
    body {
      background: #222; 
      color: white; 
      font-family: sans-serif; 
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #puzzle {
      display: grid; 
      grid-template-columns: repeat(14, 85px); 
      grid-template-rows: repeat(10, 80px);
      gap: 0;
      width: fit-content; 
      margin: auto;
    }
    .piece {
      width: 85px;
      height: 80px;
      background-color: #000;
      background-size: cover;
      image-rendering: pixelated;
    }
  </style>

    <audio id="popSound" src="pop.mp3" preload="auto"></audio>

    <style>
      
    #iiizo {
      width: 200px;
      height: auto;

        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: bold;
        color: #ffeb3b;
        text-shadow: 2px 2px 4px #000;
        font-family: "Impact", "Arial Black", sans-serif;
        opacity: 0;
        pointer-events: none;
        z-index: 1000;
        animation: none;
      }

      @keyframes popFade {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0;
        }
        30% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0;
        }
      }
    </style>
    </head>
    



<body>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
    <div id="clock" style="color: white; font-size: 31px; font-family: monospace; margin-right: 20px;">
      ⏰ --
    </div>
    <h1 style="margin: 0;">🎏 ACRC ナレ４_Liveパズル！</h1>
  </div>

  <img id="iiizo" src="ma185_2_3.png" alt="わーい" />

  <div style="position: absolute; top: 10px; left: 10px; color: white; font-size: 22px; font-family: monospace;" id="clock">
    ⏰ --
  </div>

  
  <p>ACRCメンバーの出席人数を自動カウントしています</p>
  <input type="number" id="countInput" min="0" max="140" value="0" oninput="updatePuzzle()"/>
  
  <div style="margin-bottom: 1em; color: white; font-size: 18px;">
    出席人数：<span id="currentCount">0</span>人　
    完成率：<span id="completionRate">0</span>%
  </div>
  <div id="puzzle"></div>


  <script>
    const totalPieces = 140;
    const rows = 10;
    const cols = 14;
    const puzzleDiv = document.getElementById("puzzle");

    const allPieces = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        allPieces.push({row: r, col: c, key: r + "_" + c});
      }
    }

    const randomOrder = ["6_13","5_0","3_12","3_6","5_7","8_8","7_2","4_6","4_7","5_11","0_8","7_0","2_8","2_12","3_13","0_5","5_2","1_4","3_9","3_0","3_4","7_12","1_10","2_9","8_11","7_10","1_3","6_6","1_7","5_5","4_13","2_7","6_11","2_13","5_9","6_5","6_2","2_3","9_7","0_9","1_5","4_11","3_3","5_1","8_7","6_8","7_9","2_2","2_0","6_10","8_9","0_11","0_0","5_6","4_4","1_6","2_1","2_5","0_3","6_7","4_3","6_9","3_2","1_8","8_13","6_12","5_10","2_6","9_4","7_4","1_13","8_3","1_12","5_3","7_5","2_11","9_0","7_7","2_10","0_12","7_3","9_1","9_10","5_4","7_6","4_5","3_11","3_1","0_2","9_3","9_11","7_8","7_11","9_12","0_6","6_3","8_0","8_1","6_4","3_7","9_2","5_13","8_10","4_12","4_1","4_8","3_8","9_8","9_5","3_10","8_6","2_4","1_9","0_13","0_10","9_9","1_0","9_6","1_11","6_0","8_4","8_5","1_2","3_5","4_2","8_12","4_0","0_1","9_13","5_8","6_1","0_7","1_1","7_13","4_10","7_1","4_9","0_4","5_12","8_2"];

    
let previousCount = 0;

function updatePuzzle() {

      
    const count = parseInt(document.getElementById("countInput").value);
    document.getElementById("currentCount").textContent = count;
    
    document.getElementById("completionRate").textContent = Math.round((count / totalPieces) * 100);
    if (count > previousCount) {
      const iiizo = document.getElementById("iiizo");
      iiizo.style.animation = "none";
      void iiizo.offsetWidth;  // reflow
      iiizo.style.animation = "popFade 1.5s ease-out";
    }
    previousCount = count;


      puzzleDiv.innerHTML = "";

      const visibleSet = new Set(randomOrder.slice(0, count));

      allPieces.forEach(p => {
        const div = document.createElement("div");
        div.className = "piece";
        if (!puzzleDiv.querySelector(`[data-key="${p.key}"]`) && visibleSet.has(p.key)) {
          const sound = document.getElementById('popSound');
          if (sound) {
            sound.currentTime = 0;
            sound.play();
          }
        }
        div.setAttribute("data-key", p.key);
        if (visibleSet.has(p.key)) {
          div.style.backgroundImage = `url('pieces/piece_` + p.key + `.png')`;
        }
        puzzleDiv.appendChild(div);
      });
    }

    updatePuzzle();
  </script>

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `⏰ ${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>

</html>
